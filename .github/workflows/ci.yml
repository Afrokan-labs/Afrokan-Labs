# Checks every pull request and every push to main (architecture §11).
# A PR that fails any step, including the Lighthouse budgets, cannot merge
# once branch protection requires this workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # CI builds use the production URL; previews get their own on Cloudflare.
      NEXT_PUBLIC_SITE_URL: https://afrokanlabs.com
      # Turnstile's published test key (always passes); production uses the real one.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Validate content
        run: pnpm content:validate

      # The contact form's Pages Function, with Turnstile and Resend stubbed.
      - name: Contact function
        run: pnpm test:contact

      - name: Build
        run: pnpm build

      - name: Lighthouse CI
        run: pnpm lhci

      # The built /contact form against a stubbed /api/contact and Turnstile.
      - name: Contact form
        run: pnpm test:contact-form

      # axe on every built page plus a keyboard pass (BUILD_PLAN 4.3).
      - name: Accessibility
        run: pnpm a11y

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

      # Enable after launch (BUILD_PLAN 5.1): from then on no PR may add a TODO_.
      # - name: Launch check
      #   run: pnpm launch:check
